[build]
command = "composer install --no-dev --optimize-autoloader && php artisan config:cache && php artisan route:cache && php artisan view:cache && mkdir -p storage/framework/sessions storage/framework/views storage/framework/cache && chmod -R 775 storage bootstrap/cache && touch database/database.sqlite && php artisan migrate --force"

[deploy]
startCommand = "php artisan serve --host=0.0.0.0 --port=$PORT"
