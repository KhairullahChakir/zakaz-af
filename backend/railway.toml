[build]
command = "composer install --no-dev --optimize-autoloader && mkdir -p storage/framework/sessions storage/framework/views storage/framework/cache && chmod -R 775 storage bootstrap/cache"

[deploy]
startCommand = "php artisan migrate --force && php artisan config:clear && php artisan cache:clear && php artisan serve --host=0.0.0.0 --port=$PORT"
